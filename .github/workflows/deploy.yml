name: Deploy App to Sevalla (manual backup)

on:
  # Sevalla already deploys Git commits automatically. Do not also trigger on push.
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/saas-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Trigger Sevalla Deployment
        uses: sevalla-hosting/sevalla-deploy@9ac54237e055eb9113a93ae84a6722a8a89b774a # v2.0.0
        with:
          action: 'deploy-app'
          sevalla-token: ${{ secrets.SEVALLA_TOKEN }}
          app-id: '792d7602-e80b-40d1-9489-9af1d5c2a4f2'
          branch: ${{ github.ref_name }}
          wait-for-finish: true
