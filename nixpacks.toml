providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "24"

# Install the exact patched binary instead of relying on the builder's Nix snapshot.
[phases.setup]
nixPkgs = ["curl", "gnutar", "gzip", "coreutils"]

[phases.node-runtime]
dependsOn = ["setup"]
cmds = ["bash scripts/install-node.sh"]
paths = ["/app/.node-runtime/bin"]

[phases.install]
dependsOn = ["node-runtime"]
cmds = ["node --version", "npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "exec /app/.node-runtime/bin/node dist/server/index.js"
